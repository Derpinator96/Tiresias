# Static server settings only. Tunable values (pg_stat_statements.track, auto_explain
# thresholds) come from config.yaml and are applied with ALTER SYSTEM by db/apply_settings.py.
listen_addresses = '*'

shared_preload_libraries = 'pg_stat_statements,auto_explain'

# auto_explain writes plans as JSON into the server log. The log is JSON lines (jsonlog,
# PostgreSQL 15+) in a volume that only the gateway mounts, read-only.
auto_explain.log_format = 'json'
logging_collector = on
log_destination = 'jsonlog'
log_directory = '/var/log/pglog'
log_filename = 'postgresql-%Y-%m-%d.log'
log_file_mode = 0644
log_rotation_size = 0
