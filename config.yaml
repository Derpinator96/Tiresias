# Blind Tuner configuration. Every tunable value lives here, never in code.
# Values come from docs/architecture.md "Configuration values" unless marked otherwise.
# They are starting points to tune, not results.

dataset:
  # Sales table size. 1,000,000 for the walking skeleton. 10,000,000 (the doc's fallback) set
  # by a human on 2026-10-03: the free Gemini tier timed out on the 50,000,000 flow.
  sales_rows: 10000000
  # Decision B: fixed sizes for small tables.
  regions_rows: 12
  stores_rows: 500
  products_rows: 50000
  # Decision B: customers and returns scale with sales at the doc's 2M / 50M ratio.
  customers_per_sale: 0.04
  returns_per_sale: 0.04
  # Data generation rules (doc): skew and date range.
  hero_region_id: 7
  hero_region_share: 0.30
  top_product_share: 0.20        # 20% of products ...
  top_product_revenue_share: 0.80 # ... earn 80% of revenue
  date_start: "2024-01-01"
  date_end: "2026-09-30"
  # Not in the doc's table: how much denser recent months are. Weight of a day grows
  # linearly from 1 at date_start to this value at date_end.
  recent_density_ratio: 4.0
  return_lag_days_min: 1
  return_lag_days_max: 30
  random_seed: 20261003
  # Not in the doc's table: ranges for generated values the doc leaves open.
  store_opened_days_before_start: [30, 3000]
  unit_price_range: [20.0, 2000.0]
  quantity_range: [1, 5]

canaries:
  planted_target: 20

workload:
  # Decision A: threshold for "slow". auto_explain.log_min_duration and the e2e "Q1 is slow"
  # check both read this. At 10,000,000 sales rows Q1's median is 185.0 ms (2026-10-03), below
  # the doc's 500 ms, which would never log it. 100 ms approved by a human on 2026-10-03.
  slow_query_ms: 100
  # Not in the doc's table: how many times run_q1 executes Q1 so it appears in
  # pg_stat_statements and auto_explain.
  q1_runs: 5
  # Q1's parameters, from the doc's "Demo queries": region_id = 7 AND transaction_date >= this.
  q1_since: "2026-09-26"
  # Q2's parameter, from the doc's "Demo queries": date_trunc('month', transaction_date) = this.
  q2_month: "2026-09-01"
  # Not in the doc's table: how many times the workload runs Q2 and the two-region query.
  q2_runs: 5
  # Not in the doc's table: the two-region query added for the rewrite demo (db/workload.py).
  qor_regions: [3, 7]
  # Not in the doc's table: Q3's month, a half-open range [start, end) (doc: "a monthly report
  # that reads one month of sales"; the doc gives no SQL or values), and how many times Q3 runs.
  q3_dates: ["2026-08-01", "2026-09-01"]
  q3_runs: 5
  # Not in the doc's table: whether make seed runs Q3. false pending a human decision: with Q3
  # in the seeded workload (10,000,000 rows, 2026-10-03) the Q1 index no longer pays under the
  # current lambda_storage and HypoPG's 280 MB size estimate (step reward 0.014 without Q3,
  # below 0 with it), so the search recommends only the Q2 rewrite and the doc's acceptance
  # "recommends the Q1 composite index" fails (rl/tests/test_search.py live test, e2e Q1).
  # Tests that need Q3 run it themselves and reset its statistics (rl/tests/test_partition.py).
  q3_in_seed: false
  # Q4's parameters (doc: "customer segment plus date"; the doc gives no SQL or values).
  # Not in the doc's table. Two recent days: sales rows are not stored in date order, so a
  # longer range touches most pages and no plain index helps much (HypoPG at 10,000,000 rows,
  # index on transaction_date: 7 days 13% cheaper, 2 days 53% cheaper).
  q4_segment: business
  q4_dates: ["2026-09-29", "2026-09-30"]
  # Not in the doc's table: the mixes `make drift-demo` switches between (db/drift_demo.py).
  # Each list is one round of queries; before matches the seeded workload's mix.
  drift_before: [q1, q2, qor]
  drift_after: [q4, q4, q4, q1]
  # Not in the doc's table: the database role the application workload runs as. The gateway
  # ingests only this role's queries, so test and catalog queries never become templates.
  app_role: quickmart_app
  # Not in the doc's table: rows per COPY batch when loading sales.
  copy_batch_rows: 250000

postgres:
  pg_stat_statements_track: all
  auto_explain_log_analyze: true    # production would sample with auto_explain.sample_rate
  statement_timeout_plan_generation_s: 10

plan_generation:
  # Step 18. Values from the doc's "Data and training plan" unless marked otherwise.
  # 30 in the doc; 60 approved by a human on 2026-10-03 after the first 13,200 runs kept only
  # 4,543 plans after dedupe (target 10,000).
  parameter_sets_per_query: 60
  index_setups_per_query_min: 4
  index_setups_per_query_max: 5
  target_plan_count: 10000
  early_sample_size: 200
  dsb_scale_factor: 1
  tpch_scale_factor: 1
  # Not in the doc's table: concurrent EXPLAIN ANALYZE connections (doc text: 4 to 8 workers;
  # the demo laptop has 16 cores). Concurrency adds noise to the timings; labelled in NOTES.
  workers: 8
  # Not in the doc's table: sales rows of each QuickMart copy on pg-bench, one database per
  # scale (the first is `quickmart`, others `quickmart_<rows>`). Smaller than pg-prod so runs
  # fit the statement timeout; a second scale adds plan shapes (human-approved 2026-10-03).
  quickmart_scales: [5000000, 1000000]
  # Not in the doc's table: "keep a few copies of each plan shape" (doc). Copies kept per
  # shape hash, and the log2 bucket width of estimated rows inside the hash (see db/NOTES.md).
  # 3 and 2 at first; 10 and 1 approved by a human on 2026-10-03 (db/NOTES.md).
  max_copies_per_shape: 10
  shape_rows_log2_bucket: 1
  # Not in the doc's table: where raw plans are written (repo-relative, gitignored).
  output_dir: data/plans

gateway:
  hmac_code_hex_chars: 8
  hmac_key_bytes: 32
  round_significant_figures: 2
  skew_top_mcv_count: 5
  resolver_top_templates: 3
  canary_fragment_chars: 6
  # Not in the doc's table: gateway housekeeping.
  plans_per_template: 5
  ledger_path: /var/lib/blind-tuner/ledger.jsonl
  dehash_query_chars: 80

miner:
  min_weighted_support: 0.05      # share of total query time
  # Not in the doc's table: the unweighted FP-Growth pass runs at this low threshold
  # before support is recomputed by time weight (doc, Detailed component specs).
  unweighted_min_support: 0.01
  max_index_columns: 3
  candidates_kept: 30
  min_leading_distinct: 3
  drift_window_production_s: 3600
  drift_window_demo_s: 120
  # Not in the doc's table: which of the two windows above is used (demo or production).
  drift_window_mode: demo
  drift_js_threshold: 0.2         # Jensen-Shannon distance (base 2), not the divergence
  drift_windows_required: 2
  # Not in the doc's table: how often the gateway samples pg_stat_statements for the windows.
  # A window boundary is late by up to this much.
  drift_sample_s: 2
  # Not in the doc's table: closed windows kept (and returned) per request.
  drift_windows_kept: 12

gnn:
  layers: 3
  hidden_size: 128
  dropout: 0.1
  learning_rate: 0.001
  batch_size: 64
  max_epochs: 150
  patience: 15
  template_split: [0.70, 0.15, 0.15]
  # Doc, Component 3 Use B: a 100x or larger gap between Postgres's row estimate and the actual
  # rows makes gnn_explain recommend ANALYZE.
  misestimate_ratio_alert: 100
  # Not in the doc's table: where the training export and split are written (repo-relative,
  # gitignored). The export holds numbers only and may be shared with the trainer.
  dataset_dir: data/gnn

rl:
  alpha: 0.1
  gamma: 0.9
  epsilon_start: 0.1
  epsilon_min: 0.02
  episodes: 300
  # Not in the doc's table: initial Q for unseen (state, action) pairs. Optimistic (above any
  # single-step reward, which is at most 1) so every option is explored; see rl/NOTES.md.
  q_init: 1.0
  actions_per_episode: 5
  # The doc's reward subtracts lambda_write x write ms (ms) from a fractional time drop
  # (unitless). Kept as is, approved 2026-10-03: with the per-index penalty below it acts as
  # a flat 0.1 per index, labelled as an assumption. pgbench now measures writes on the twin
  # (db/sandbox/write_cost.py): the Q1 index added a median 0.032 ms per insert over 6 runs on
  # 2026-10-03 (range -0.118 to 0.196 ms, load average 17 to 32 on 16 cores). At 1.0 per ms that
  # is a penalty near 0.03 against a predicted drop near 0.6 for Q1, so write cost does not
  # change the pick at this scale. The units still mix ms with a unitless drop; scaling ms by a
  # reference insert latency is a human decision, not made here.
  lambda_write: 1.0               # per added ms of insert latency
  # Changed from the doc's 1.0, approved by a human 2026-10-03. At 1.0 the 28 MB Q1 index
  # (budget 23.8 MB) scored storage 1.179 against a 0.641 predicted drop, so the search
  # recommended nothing, contradicting the doc's RL acceptance criterion.
  lambda_storage: 0.25
  storage_budget_table_share: 0.25
  configs_verified_on_twin: 3
  # Not in the doc's table: weight of the disagreement penalty in the top-3 re-check (doc:
  # "penalise disagreement" between the estimator and raw HypoPG cost, weight not given).
  # Score = measured reward - this x |estimator's predicted drop - HypoPG cost drop|.
  lambda_disagreement: 1.0
  # Not in the doc's table: seconds a HypoPG result or twin measurement of the same set of
  # actions is reused in the ai process (doc: identical configs are never re-costed), so
  # run_rl and simulate do not re-cost or rebuild what /ai/rl/run just did. A reseed within
  # this window serves the earlier numbers; the dashboard labels reused measurements.
  sim_cache_s: 1800
  # Not in the doc's table: assumed insert cost of one new index during search
  # (doc: "use a simple per-index penalty in search"). An assumption, not a measurement.
  # The twin measured about 0.03 ms for the Q1 index (see lambda_write); 0.1 kept until a
  # human approves a change.
  write_penalty_ms_per_index: 0.1
  # Doc, Component 4 item 6: partition keys scored on the twin only, at most two, after the
  # index search (rl/search.py partition_keys and add_partition).
  partition_max_keys: 2
  # Not in the doc's table: HTTP timeout in seconds for a twin measurement with a partition
  # action. The gateway copies the whole table into a partitioned copy on the twin first: the
  # full 4-template workload with the Q1 index took 77 s at 10,000,000 sales rows on
  # 2026-10-03 (loaded machine); other calls keep agent/gateway_client.py's 120 s.
  partition_twin_timeout_s: 600

sandbox:
  twin_hero_table_scale: 1.0
  twin_other_tables_scale: 0.2
  timing_runs: 5                  # median of 5 warm runs
  # Not in the doc's table: untimed runs before the timed ones, so the timed runs are warm.
  warmup_runs: 1
  # Not in the doc's table: private file holding the twin's frequency-rank map (real
  # most-common values -> twin values). Lives in the gateway's volume; never sent.
  twin_map_path: /var/lib/blind-tuner/twin_map.json
  pgbench_insert_rate_per_s: 200
  # Not in the doc's table: how long each pgbench insert run lasts (db/sandbox/write_cost.py),
  # once without and once with the configuration's indexes.
  pgbench_duration_s: 10
  # Not in the doc's table: the configuration measured per query for twin fidelity (doc:
  # "twin speedup / production speedup, reported per query"). The search has no rewrite
  # actions yet, so these are the doc's expected picks: Q1 its composite index; Q2 the
  # date_trunc rewrite plus the index HypoPG costed cheapest for the rewritten Q2 on 2026-10-03
  # at 10,000,000 rows (store_id, transaction_date: 125,322 against 149,616 for
  # transaction_date alone and 160,399 with no index); the two-region query its IN rewrite plus
  # Q1's index. make fidelity builds these indexes on pg-prod only while it measures, then drops
  # them (human-approved 2026-10-03).
  fidelity_queries:
    q1: {indexes: [[sales, [region_id, transaction_date]]], rewrite: null}
    q2: {indexes: [[sales, [store_id, transaction_date]]], rewrite: date_trunc_eq_to_range}
    qor: {indexes: [[sales, [region_id, transaction_date]]], rewrite: or_same_column_to_in}
    # Not in the doc's table: Q3 with a monthly range partition on transaction_date and no
    # index (the doc's partition query). Measured on a partitioned copy of sales, on pg-prod
    # too, dropped after the measurement; pg-prod's own sales is never renamed or changed.
    q3: {indexes: [], rewrite: null, partition: [sales, transaction_date]}
  # Not in the doc's table: where make fidelity writes its result (gateway volume; the
  # dashboard reads it through the gateway, the exporter from the tools container).
  fidelity_path: /var/lib/blind-tuner/twin_fidelity.json

verify:
  verieql_rows_per_table: 5
  verieql_timeout_s: 60

llm:
  # Decision C. Model name taken from https://ai.google.dev/gemini-api/docs/models on
  # 2026-10-03 (newest stable Flash listed), confirmed the same day against the API's own
  # model list by agent/tests/test_live_llm.py.
  # Which LLM answers: gemini, openai, nim or ollama. Switching provider is this one value; each
  # provider's own settings are below (Gemini's are model and api_key_env, kept at this level).
  provider: gemini
  # Human decision 2026-10-03: when the provider fails (rate limited after all retries, host
  # unreachable, timeout, HTTP error such as a revoked key, malformed reply, key or model not
  # set), the whole answer is asked again of the next provider in this list, in order. A canary
  # block never fails over (fail closed), and air-gapped mode (BT_LLM_PROVIDER) never does.
  fallback: [openai, nim]
  model: gemini-3.8-flash
  api_key_env: GEMINI_API_KEY
  temperature: 0
  max_tool_calls: 8
  # Not in the doc's table: backoff for HTTP 429 (decision C) and transient 500/503/504.
  retry_max_attempts: 5
  retry_initial_backoff_s: 2.0
  retry_backoff_multiplier: 2.0
  retry_max_backoff_s: 30.0
  checker_retries: 1
  # NVIDIA NIM (hosted, OpenAI-compatible chat completions with tools), not in the doc's table.
  # Request bodies go through POST /v1/ledger/outbound like Gemini's.
  nim:
    base_url: https://integrate.api.nvidia.com/v1
    # Chosen by make llm-bench on 2026-10-03. Of about 80 listed models only two returned a tool call
    # for this key; on the Q1 flow (0 tool-call errors for both) the number checker passed
    # google/diffusiongemma-26b-a4b-it 1 run in 4 (16.1 s of LLM time on the passing run) and
    # nvidia/nemotron-3-ultra-550b-a55b 0 runs in 2. A low pass rate: see agent/NOTES.md.
    model: google/diffusiongemma-26b-a4b-it
    api_key_env: NVIDIA_API_KEY
    # Reply token cap, sent under the request field named by max_tokens_field.
    max_tokens: 1024
    max_tokens_field: max_tokens
    # Send llm.temperature with each request.
    send_temperature: true
    # HTTP timeout per request.
    timeout_s: 120
    # Free tier is about 40 requests per minute per model: at least this many seconds between
    # two requests from one provider object (60 / 40 = 1.5).
    min_request_interval_s: 1.5
    # Candidate selection for make llm-bench: model IDs containing a preferred family are tried
    # first; IDs containing an excluded pattern are never tried (reasoning-only models such as
    # DeepSeek-R1 are poor at tool use; the rest cannot chat with tools at all).
    prefer_families: [nemotron]
    exclude_patterns: [deepseek-r1, reason, embed, rerank, reward, guard, safety, vision, vlm, -vl-, parse, retriever, clip, ocr]
    bench_candidates: 3
  # OpenAI (hosted chat completions with tools, same adapter as NIM), not in the doc's table.
  # Request bodies go through POST /v1/ledger/outbound like every hosted provider's.
  openai:
    base_url: https://api.openai.com/v1
    # PENDING: not chosen yet (model IDs are not guessed). Until it is set, provider openai
    # refuses to start and the fallback chain skips it. Choose with
    # python -m scripts.llm_bench run --provider openai --models <id>.
    model: ""
    api_key_env: OPENAI_API_KEY
    max_tokens: 1024
    # OpenAI's API reference marks max_tokens deprecated for chat completions in favour of
    # max_completion_tokens, which reasoning models require. UNVERIFIED live (no key yet).
    max_tokens_field: max_completion_tokens
    # Reasoning models accept only the default temperature; set false for those.
    send_temperature: true
    timeout_s: 120
    min_request_interval_s: 0.0
  # Air-gapped mode (step 31), not in the doc's table. make airgap switches the ai service to
  # this provider (env BT_LLM_PROVIDER=ollama) and replaces its networks with an internal one;
  # llm.provider above stays the default. Ollama runs natively on the host (README.md).
  ollama:
    # The host side of the internal llm-local network in infra/docker-compose.airgap.yml
    # (gateway 10.31.31.1). Ollama must listen there: OLLAMA_HOST=10.31.31.1:11434.
    base_url: http://10.31.31.1:11434
    # Human decision 2026-10-03 ("gemma 2b"): gemma2:2b, 1.6 GB, 8K context (ollama.com).
    # One value to change for another local model; num_ctx below must match it.
    model: gemma2:2b
    # gemma2's context length (8K, ollama.com). Sent as options.num_ctx on every request;
    # Ollama's own default is 4096 (docs.ollama.com/faq).
    num_ctx: 8192
    # Reply token cap (options.num_predict), reserved inside num_ctx by the overflow guard.
    num_predict: 768
    # Pre-send overflow guard (no tokenizer is installed): every digit counts as one token
    # (gemma splits digits) and other characters at this many per token. Conservative for JSON
    # (English prose is nearer 4). An assumption until calibrated from the "prompt tokens
    # evaluated" events of a real run.
    chars_per_token: 2.5
    # Extra attempts when a reply is not one valid JSON tool call or answer.
    malformed_retries: 1
    # HTTP timeout per request; the first request also loads the model into memory.
    timeout_s: 300

privacy:
  # Not in the doc's table: characters of one run's payloads the adversarial leak test sends to
  # the LLM in its single request (LLM bodies first, then AI-side payloads), to stay inside the
  # free Gemini tier's tokens per minute. Measured 2026-10-03 on one live Q1 ask: 223 distinct
  # payloads, 769,666 characters, most of them ~200 HypoPG costings from the search; 300,000
  # got HTTP 429 on all retries; 100,000 already holds the 4 LLM bodies and all 37 table and
  # column codes. The result file and the dashboard report how much of the run was sent.
  adversarial_max_chars: 120000

egress:
  # Not in the doc's table (the doc says "only to the LLM API"): what the egress proxy for ai
  # (infra/egress_proxy.py) opens tunnels to. HTTP CONNECT only; every other host, port or
  # method is denied. The hosts must match agent/llm.py's GEMINI_URL, llm.nim.base_url and
  # llm.openai.base_url (a test checks it).
  allowed_hosts: [generativelanguage.googleapis.com, integrate.api.nvidia.com, api.openai.com]
  allowed_ports: [443]
  # Not in the doc's table: seconds the proxy waits for a request head and for the upstream
  # connection before giving up.
  connect_timeout_s: 10

approve:
  post_deploy_check_minutes: 10
  rollback_if_median_worse_by: 0.10
  # Not in the doc's table: replay minutes per phase when the dashboard demo runs the
  # post-deploy check on the twin (labelled on screen as shortened). Production uses the 10 above.
  demo_check_minutes: 0.1

web:
  # site/web live Ask page (local web container only; the public site never calls a service).
  # Read at runtime by site/web/src/lib/ask-server.ts from the read-only mount BT_CONFIG.
  ask_timeout_s: 300   # per gateway or ai call; same as dashboard/data.py TIMEOUT_S (Node's fetch also stops waiting for headers at 300 s)
  ask_poll_ms: 1000    # how often the page asks for progress, like the dashboard's 1 s fragment

tests:
  fast_suite_limit_s: 120
  # e2e acceptance threshold (doc: "Q1 measured on the twin drops by over 50%").
  q1_min_twin_speedup: 0.50
  # e2e acceptance threshold (doc: "Q2 measured on the twin drops by over 50%").
  q2_min_twin_speedup: 0.50
